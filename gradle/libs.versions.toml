[versions]
agp = "8.5.1"
kotlin = "1.9.0"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.0"
constraintlayout = "2.1.4"
cardview = "1.0.0"
core-ktx = "1.13.0"
firebase-bom = "32.7.0"
junit = "4.13.2"
ext-junit = "1.2.1"
espresso-core = "3.6.1"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
